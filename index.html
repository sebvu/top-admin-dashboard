<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/css-reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <script src="scripts/script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="sidebar__container --size-context-xl">
          <ul class="sidebar__list">
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/dashboard.svg"
                alt="Dashboard Icon"
              />
              <h1 class="--inherit-font-size">Dashboard</h1>
            </li>
          </ul>
        </div>
        <div class="sidebar__container --size-context-md">
          <!-- wrapped in anchor elements for real application purposes -->
          <ul class="sidebar__list">
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/home.svg"
                alt="Home Icon"
              /><a class="--text-bold">Home</a>
            </li>
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/profile.svg"
                alt="Profile Icon"
              /><a class="--text-bold">Profile</a>
            </li>
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/messages.svg"
                alt="Messages Icon"
              /><a class="--text-bold">Messages</a>
            </li>
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/history.svg"
                alt="History Icon"
              /><a class="--text-bold">History</a>
            </li>
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/tasks.svg"
                alt="Tasks Icon"
              /><a class="--text-bold">Tasks</a>
            </li>
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/community.svg"
                alt="Communities Icon"
              /><a class="--text-bold">Communities</a>
            </li>
          </ul>
        </div>
        <div class="sidebar__container --size-context-md">
          <ul class="sidebar__list">
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/settings.svg"
                alt="Settings Icon"
              /><a class="--text-bold">Settings</a>
            </li>
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/support.svg"
                alt="Support Icon"
              /><a class="--text-bold">Support</a>
            </li>
            <li class="sidebar__item --_access-height --_access-font-size">
              <img
                class="--icon"
                src="assets/sidebar/privacy.svg"
                alt="Privacy Icon"
              /><a class="--text-bold">Privacy</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="header"></div>
      <div class="main-content"></div>
    </div>
  </body>
</html>
